{% extends "base.html" %}
{% block title %}Edit — {{ item.title }}{% endblock %}
{% block nav %}
<a href="/admin">Dashboard</a>
<a href="/admin/notes">Notes</a>
<a href="/admin/content">Content</a>
<a href="/admin/generate">Generate</a>
{% endblock %}
{% block content %}
<section class="page stack">
  <h1>Edit content</h1>
  {% if error %}<div class="flash-error">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/content/{{ item.id }}/edit" class="stack">
    <div>
      <label for="title">Title</label>
      <input id="title" name="title" type="text" value="{{ item.title }}" required>
    </div>
    <div>
      <label for="slug">Slug</label>
      <input id="slug" name="slug" type="text" value="{{ item.slug }}" required>
    </div>
    <div>
      <label for="summary">Summary</label>
      <textarea id="summary" name="summary" required>{{ item.summary }}</textarea>
    </div>
    <div>
      <label for="article_markdown">Article Markdown</label>
      <textarea id="article_markdown" name="article_markdown" style="min-height: 18rem;" required>{{ item.article_markdown }}</textarea>
    </div>
    <div>
      <label for="teaching_example_json">Teaching example JSON</label>
      <textarea id="teaching_example_json" name="teaching_example_json" required>{{ teaching_example_json }}</textarea>
    </div>
    <div>
      <label for="quiz_json">Quiz JSON</label>
      <textarea id="quiz_json" name="quiz_json" style="min-height: 14rem;" required>{{ quiz_json }}</textarea>
    </div>
    <div>
      <label for="sources_json">Sources JSON</label>
      <textarea id="sources_json" name="sources_json" required>{{ sources_json }}</textarea>
    </div>
    <div class="actions">
      <button type="submit">Save edits</button>
      <a class="btn btn--secondary" href="/admin/content/{{ item.id }}/preview">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
